# The product, on one computer: Postgres, API and web app. This is how it runs
# now — there is no hosted copy. See docs/OFFLINE.md; offline/start.bat (or
# start.sh) runs the command below.
#
#   docker compose -f docker/docker-compose.yml up -d --build
#
# Nothing here calls out at run time. The data lives in the pgdata volume on
# this machine and survives stop, start and rebuild; offline/backup writes it
# to a file.
#
# The API creates and migrates its own tables on start. Nothing is loaded into
# Postgres beforehand.
#
# Sign-in is off by default (AUTH_DISABLED=1): the app opens on the dashboard
# as the API's built-in local user. Because of that, every port is published
# on 127.0.0.1 only — this computer, not the office network. Anyone who can
# reach the page can read the payroll in it, so before setting
# BIND_ADDRESS=0.0.0.0 to share it, build with AUTH_DISABLED=0 so people sign in.

services:
  db:
    # Comes back by itself after a restart of the computer or of Docker.
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-payroll}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payroll}
      POSTGRES_DB: ${POSTGRES_DB:-payroll_db}
    # 5433 on the host, so a Postgres already installed on this machine
    # (which holds 5432) does not stop this one starting. The API reaches it
    # inside Docker as db:5432 whatever this says.
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    # Comes back by itself after a restart of the computer or of Docker.
    restart: unless-stopped
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    env_file:
      - path: ../.env
        required: false
    environment:
      # Always the db service. Not ${DATABASE_URL}: the .env for running the
      # API outside Docker points at localhost, which inside this container
      # is the container itself, and the API would never find its database.
      DATABASE_URL: postgresql://${POSTGRES_USER:-payroll}:${POSTGRES_PASSWORD:-payroll}@db:5432/${POSTGRES_DB:-payroll_db}
      ENV: dev
      ALLOW_ANONYMOUS_API: "true"
      JWT_SECRET: ${JWT_SECRET:-local-docker-only-not-a-secret}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    # Comes back by itself after a restart of the computer or of Docker.
    restart: unless-stopped
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_AUTH_DISABLED: ${AUTH_DISABLED:-1}
    environment:
      # Used when the page is opened by another hostname (a LAN address, say),
      # where the browser goes through the web server's relay.
      BACKEND_URL: http://backend:8000
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  pgdata:

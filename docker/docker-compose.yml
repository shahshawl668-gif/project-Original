# Local stack: Postgres, API and web app.
#
#   docker compose -f docker/docker-compose.yml up --build
#
# The API creates and migrates its own tables on start, exactly as it does on
# Render. Nothing is loaded into Postgres beforehand: a database shaped by a
# separate SQL file is a different database from production's, and tests
# against it prove nothing about production.
#
# Sign-in is off by default here (AUTH_DISABLED=1): the app opens on the
# dashboard as the API's built-in local user. Build with AUTH_DISABLED=0 to
# test sign-in and sign-up. Production is unaffected either way — with
# ENV=production the API refuses requests without a token.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-payroll}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payroll}
      POSTGRES_DB: ${POSTGRES_DB:-payroll_db}
    # 5433 on the host, so a Postgres already installed on this machine
    # (which holds 5432) does not stop this one starting. The API reaches it
    # inside Docker as db:5432 whatever this says.
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    env_file:
      - path: ../.env
        required: false
    environment:
      # Always the db service. Not ${DATABASE_URL}: the .env for running the
      # API outside Docker points at localhost, which inside this container
      # is the container itself, and the API would never find its database.
      DATABASE_URL: postgresql://${POSTGRES_USER:-payroll}:${POSTGRES_PASSWORD:-payroll}@db:5432/${POSTGRES_DB:-payroll_db}
      ENV: dev
      ALLOW_ANONYMOUS_API: "true"
      JWT_SECRET: ${JWT_SECRET:-local-docker-only-not-a-secret}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_AUTH_DISABLED: ${AUTH_DISABLED:-1}
    environment:
      # Used when the page is opened by another hostname (a LAN address, say),
      # where the browser goes through the web server's relay.
      BACKEND_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  pgdata:

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-postgres.txt
          pip install -r requirements-dev.txt
      - name: Bytecode compile
        run: python -m compileall -q app
      - name: Lint (ruff)
        run: ruff check app tests
      - name: Security scan (bandit)
        run: bandit -c pyproject.toml -r app
      - name: Run unit tests
        run: pytest -q tests

  backend-postgres:
    # SQLite ignores foreign keys and has no FOR UPDATE SKIP LOCKED. Both have
    # hidden real bugs here, so the suite also runs on the database production uses.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: payroll_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-postgres.txt -r requirements-dev.txt
      - name: Run unit tests on PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg2://ci:ci-only-not-a-secret@localhost:5432/payroll_ci
        run: pytest -q tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

  supply-chain:
    # Known-vulnerable dependencies fail the build unless someone has assessed
    # them in security/dependency-exceptions.json; secrets fail it outright.
    # The software bill of materials for each side is kept with every run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Secret scan (whole history)
        run: |
          curl -sSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks detect --source . --redact --no-banner
      - name: Install audit tools
        run: pip install pip-audit cyclonedx-bom
      - name: Backend SBOM (runtime dependencies only)
        run: |
          python -m venv /tmp/prod
          /tmp/prod/bin/pip install -q -r backend/requirements-postgres.txt
          cyclonedx-py environment /tmp/prod/bin/python -o sbom-backend.cdx.json
      - name: Frontend SBOM (runtime dependencies only)
        working-directory: frontend
        run: |
          npm ci
          npx --yes @cyclonedx/cyclonedx-npm@1 --omit dev --output-file ../sbom-frontend.cdx.json
      - name: Vulnerability audit
        run: |
          pip-audit -r backend/requirements-postgres.txt -f json -o pip-audit.json || true
          (cd frontend && npm audit --omit=dev --json > ../npm-audit.json) || true
          python tools/dependency_audit.py pip-audit.json npm-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom-and-audit
          path: |
            sbom-backend.cdx.json
            sbom-frontend.cdx.json
            pip-audit.json
            npm-audit.json

  docs:
    # The handbook is the thing people act on. Nothing else in CI notices when
    # it stops describing the code, so this does.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Handbook still describes the code
        run: python docs/tools/check_docs_current.py

# Render Blueprint — provisions the FastAPI service.
# Push the repo to GitHub, then in Render: New → Blueprint → connect this repo.
#
# MongoDB is NOT provisioned here: Render has no managed MongoDB. Create a free
# cluster on MongoDB Atlas (or run your own), then set MONGODB_URL in the
# service's environment to the connection string, e.g.
#   mongodb+srv://USER:PASSWORD@cluster0.xxxxx.mongodb.net/payroll?retryWrites=true&w=majority
# Remember to allow Render's outbound IPs in the Atlas network access list.

services:
  - type: web
    name: payroll-saas-api
    runtime: docker
    plan: starter
    autoDeploy: true
    dockerfilePath: ./docker/Dockerfile.backend
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8000"
      - key: ENV
        value: production
      - key: ALLOW_ANONYMOUS_API
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://peopleopslab.in,https://www.peopleopslab.in"
      # Set this in the Render dashboard (marked sync:false so the blueprint
      # never carries the credential).
      - key: MONGODB_URL
        sync: false
      - key: MONGODB_DB
        value: payroll
